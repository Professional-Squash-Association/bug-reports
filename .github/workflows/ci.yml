name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/bug_reports_test
        run: bin/rails db:test:prepare test

  # Builds the Docker image exactly as `fly deploy` does and checks every built CSS/JS file
  # reached public/assets; a plain precompile once passed while the real image had no tailwind.css.
  image:
    name: Production Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: production-image:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the precompiled assets
        env:
          CHECK: |
            require "json"
            manifest = "public/assets/.manifest.json"
            built = Dir.glob("app/assets/builds/**/*").select { |f| File.file?(f) }
                       .map { |f| f.delete_prefix("app/assets/builds/") }
                       .reject { |f| File.basename(f).start_with?(".") || f.end_with?(".map") }
            lock = File.exist?("Gemfile.lock") ? File.read("Gemfile.lock") : ""
            expected = lock.match?(/^    tailwindcss-rails /) ? [ "tailwind.css" ] : []
            if built.empty? && expected.empty? && !File.exist?(manifest)
              puts "No asset pipeline in this image; nothing to check."
              exit
            end
            abort "#{manifest} is missing: assets:precompile did not run in the image." unless File.exist?(manifest)
            logical = JSON.parse(File.read(manifest)).keys
            missing = ((built | expected) - logical).sort
            abort "Missing from the precompiled assets, so pages would raise Propshaft::MissingAssetError: #{missing.join(', ')}" if missing.any?
            puts "OK: #{logical.size} precompiled assets, including #{(built | expected).sort.join(', ')}"
        run: docker run --rm --entrypoint ruby production-image:ci -e "$CHECK"
